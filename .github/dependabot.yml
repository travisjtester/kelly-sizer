# Weekly update PRs for Python packages and GitHub Actions. Each one runs the
# test suite like any other PR, and main only accepts it if the tests pass.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # requirements.txt holds minimums (>=), so the newest versions install
    # anyway and the weekly test run catches breakage. Only raise a minimum
    # when the current one blocks a newer version; raising them all to the
    # latest dropped Python 3.11 support (numpy 2.5 needs 3.12).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
