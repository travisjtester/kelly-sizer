name: Tests

# Runs the offline suite (fake Yahoo, no network) on every pull request and on
# main. Branch protection requires it to pass before a PR can merge, and main
# auto-deploys to Streamlit Cloud, so nothing untested goes live. It also runs
# weekly: requirements are minimums, so Streamlit Cloud installs the newest
# packages on each deploy, and a new release could break the app with no
# change here. The weekly run catches that and emails the owner.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 12 * * 1"     # Mondays, before the live data check
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
